<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2F5D50; } a:hover { color: #23463C; }
  </style>
</helmet>

<div style="width: 1000px; height: 760px; box-sizing: border-box; background: #FBFAF8; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #1A1815; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px;">

  <div style="width: 100%; max-width: 520px; display: flex; flex-direction: column;">

    <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 42px; line-height: 1.12; letter-spacing: -0.012em;">
      What are you job hunting for?
    </h1>

    <p style="margin: 16px 0 0; font-size: 15.5px; line-height: 1.6; color: #57544E;">
      This shapes the questions we ask and how your resume gets tailored.
    </p>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 40px;">
      <sc-for list="{{options}}" as="opt" hint-placeholder-count="3">
        <button onClick="{{opt.pick}}" style="{{opt.style}}">
          <span>{{opt.label}}</span>
          <sc-if value="{{opt.selected}}" hint-placeholder-val="{{true}}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px; margin-top: 34px;">
      <label style="font-size: 14px; color: #57544E;">
        What kind of work? <span style="color: #9A9690;">optional</span>
      </label>
      <input type="text" placeholder="backend engineering, data science, product design…" style="width: 100%; box-sizing: border-box; padding: 14px 16px; border: 1px solid #E0DCD4; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1A1815; outline: none;">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 48px;">
      <button style="padding: 12px 4px; border: none; background: none; font-family: inherit; font-size: 15px; color: #8A8680; cursor: pointer;">
        Back
      </button>
      <button style="padding: 14px 34px; border: none; border-radius: 4px; background: #2F5D50; color: #FBFAF8; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">
        Continue
      </button>
    </div>

  </div>

  <div style="display: flex; gap: 7px; margin-top: 88px;">
    <div style="width: 7px; height: 3px; border-radius: 2px; background: #DCD8D0;"></div>
    <div style="width: 26px; height: 3px; border-radius: 2px; background: #2F5D50;"></div>
    <div style="width: 7px; height: 3px; border-radius: 2px; background: #DCD8D0;"></div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'new_grad' };
  }

  renderVals() {
    const base =
      'display: flex; align-items: center; justify-content: space-between; gap: 12px;' +
      'width: 100%; box-sizing: border-box; padding: 17px 18px; border-radius: 4px;' +
      "font-family: inherit; font-size: 15px; text-align: left; cursor: pointer;";

    const options = [
      { id: 'internship', label: 'Looking for an internship' },
      { id: 'new_grad', label: 'New grad / early career' },
      { id: 'experienced', label: 'Experienced hire' },
    ].map((o) => {
      const selected = this.state.picked === o.id;
      return {
        ...o,
        selected,
        pick: () => this.setState({ picked: o.id }),
        style:
          base +
          (selected
            ? 'border: 1px solid #2F5D50; background: #F1F4F2; color: #1A1815;'
            : 'border: 1px solid #E0DCD4; background: #FFFFFF; color: #3D3A35;'),
      };
    });

    return { options };
  }
}
</script>
</body>
</html>
