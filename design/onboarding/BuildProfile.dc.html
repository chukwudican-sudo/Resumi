<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2F5D50; } a:hover { color: #23463C; }
  </style>
</helmet>

<div style="width: 1000px; height: 760px; box-sizing: border-box; background: #FBFAF8; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #1A1815; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px;">

  <div style="width: 100%; max-width: 520px; display: flex; flex-direction: column;">

    <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 42px; line-height: 1.12; letter-spacing: -0.012em;">
      How should we build your profile?
    </h1>

    <p style="margin: 16px 0 0; font-size: 15.5px; line-height: 1.6; color: #57544E;">
      Either way you end up with the same thing — a profile Resumi can tailor for any job.
    </p>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 40px;">

      <button style="display: flex; align-items: flex-start; gap: 16px; width: 100%; box-sizing: border-box; padding: 24px; border: 1px solid #2F5D50; border-radius: 5px; background: #F1F4F2; font-family: inherit; text-align: left; cursor: pointer;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <path d="M17 8l-5-5-5 5"></path>
          <path d="M12 3v13"></path>
        </svg>
        <span style="display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 16.5px; font-weight: 500; color: #1A1815;">Upload your resume</span>
          <span style="font-size: 14.5px; line-height: 1.55; color: #57544E;">PDF or Word. Fastest way in — we read it and you&rsquo;re done.</span>
        </span>
      </button>

      <button style="display: flex; align-items: flex-start; gap: 16px; width: 100%; box-sizing: border-box; padding: 24px; border: 1px solid #E0DCD4; border-radius: 5px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#57544E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span style="display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 16.5px; font-weight: 500; color: #1A1815;">Don&rsquo;t have one? Answer a few questions</span>
          <span style="font-size: 14.5px; line-height: 1.55; color: #57544E;">We&rsquo;ll ask about your work and build the resume from your answers.</span>
        </span>
      </button>

    </div>

    <div style="margin-top: 44px;">
      <button style="padding: 12px 4px; border: none; background: none; font-family: inherit; font-size: 15px; color: #8A8680; cursor: pointer;">
        Back
      </button>
    </div>

  </div>

  <div style="display: flex; gap: 7px; margin-top: 88px;">
    <div style="width: 7px; height: 3px; border-radius: 2px; background: #DCD8D0;"></div>
    <div style="width: 7px; height: 3px; border-radius: 2px; background: #DCD8D0;"></div>
    <div style="width: 26px; height: 3px; border-radius: 2px; background: #2F5D50;"></div>
  </div>

</div>
