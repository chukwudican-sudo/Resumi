<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2F5D50; } a:hover { color: #23463C; }
  </style>
</helmet>

<div style="width: 1000px; height: 760px; box-sizing: border-box; background: #FBFAF8; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #1A1815; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px;">

  <div style="width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; text-align: center;">

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 56px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"></path>
      </svg>
      <span style="font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #6B6862;">Resumi</span>
    </div>

    <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 58px; line-height: 1.08; letter-spacing: -0.015em; text-wrap: pretty;">
      A resume that changes for every job you apply to
    </h1>

    <p style="margin: 28px 0 0; font-size: 17px; line-height: 1.65; color: #57544E; max-width: 460px; text-wrap: pretty;">
      Paste in a job posting and Resumi rewrites your resume around it — keeping everything true, and putting the parts that matter for that role first.
    </p>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 52px; width: 100%;">
      <button style="width: 100%; max-width: 320px; padding: 17px 28px; border: none; border-radius: 4px; background: #2F5D50; color: #FBFAF8; font-family: inherit; font-size: 16px; font-weight: 500; letter-spacing: 0.01em; cursor: pointer;">
        Get started
      </button>
      <span style="font-size: 13.5px; color: #8A8680;">Takes about five minutes</span>
    </div>

  </div>

  <div style="display: flex; gap: 7px; margin-top: 88px;">
    <div style="width: 26px; height: 3px; border-radius: 2px; background: #2F5D50;"></div>
    <div style="width: 7px; height: 3px; border-radius: 2px; background: #DCD8D0;"></div>
    <div style="width: 7px; height: 3px; border-radius: 2px; background: #DCD8D0;"></div>
  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
