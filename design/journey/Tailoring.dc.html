<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2F5D50; } a:hover { color: #23463C; }
    @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    .working { animation: breathe 1.8s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #FBFAF8; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #1A1815; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 62px; border-bottom: 1px solid #EDE9E2; background: #FFFFFF;">
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 14.5px; color: #1A1815;">Backend Engineering Intern</span>
      <span style="font-size: 12.5px; color: #8A8680;">Shopify &middot; Toronto</span>
    </div>
    <button style="padding: 9px 16px; border: 1px solid #DDD8D0; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-size: 13.5px; color: #57544E; cursor: pointer;">
      Cancel
    </button>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 48px 36px;">
    <div style="width: 100%; max-width: 780px; display: grid; grid-template-columns: 1fr 300px; gap: 64px; align-items: center;">

      <div>
        <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.08;">
          Rewriting your resume for this one.
        </h1>

        <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 40px;">
          <sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; align-items: flex-start; gap: 14px;">
              <span style="{{s.mark}}">
                <sc-if value="{{s.done}}" hint-placeholder-val="{{true}}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6L9 17l-5-5"></path>
                  </svg>
                </sc-if>
              </span>
              <span style="display: flex; flex-direction: column; gap: 3px;">
                <span style="{{s.titleStyle}}">{{s.title}}</span>
                <sc-if value="{{s.showDetail}}" hint-placeholder-val="{{true}}">
                  <span style="font-size: 13.5px; line-height: 1.5; color: #A8A39B;">{{s.detail}}</span>
                </sc-if>
              </span>
            </div>
          </sc-for>
        </div>

        <p style="margin: 44px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.5; color: #B5B0A8;">
          Usually about a minute. Nothing gets added that you did not tell us.
        </p>
      </div>

      <!-- the paper assembling itself -->
      <div style="border: 1px solid #E2DED6; background: #FFFFFF; box-shadow: 0 2px 24px rgba(26,24,21,0.06); padding: 26px 24px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #EFEBE4;">
          <div style="height: 9px; width: 108px; border-radius: 2px; background: #E0DCD4;"></div>
          <div style="height: 5px; width: 148px; border-radius: 2px; background: #EFEBE4;"></div>
        </div>
        <sc-for list="{{skeleton}}" as="row" hint-placeholder-count="7">
          <div style="{{row.style}}"></div>
        </sc-for>
      </div>

    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    // Named work, not a spinner: the wait is long enough that silence reads
    // as failure. Each line says something only this product would say.
    const stages = [
      { title: 'Read the posting', detail: 'Found 11 requirements', done: true, showDetail: true },
      { title: 'Matched them against your profile', detail: '9 covered, 2 not mentioned', done: true, showDetail: true },
      { title: 'Rewriting your experience around them', detail: '', done: false, showDetail: false, working: true },
      { title: 'Typesetting the PDF', detail: '', done: false, showDetail: false },
    ].map((s) => ({
      ...s,
      mark:
        'display: flex; align-items: center; justify-content: center; width: 21px; height: 21px;' +
        'border-radius: 50%; flex-shrink: 0; margin-top: 1px; ' +
        (s.done
          ? 'background: #2F5D50;'
          : s.working
            ? 'background: #FFFFFF; border: 2px solid #2F5D50;'
            : 'background: #FFFFFF; border: 2px solid #E2DED6;'),
      titleStyle:
        'font-size: 16px; ' +
        (s.done ? 'color: #8A8680;' : s.working ? 'color: #1A1815;' : 'color: #C0BAB1;'),
    }));

    const line = (w, tone) =>
      'height: 5px; border-radius: 2px; width: ' + w + '; background: ' + tone + ';';
    const skeleton = [
      { style: line('42%', '#DCD8D0') },
      { style: line('100%', '#EFEBE4') },
      { style: line('88%', '#EFEBE4') },
      { style: line('94%', '#EFEBE4') },
      { style: line('36%', '#DCD8D0') + 'margin-top: 10px;' },
      { style: line('100%', '#F5F2ED') },
      { style: line('72%', '#F5F2ED') },
    ];

    return { stages, skeleton };
  }
}
</script>
</body>
</html>
