<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2F5D50; } a:hover { color: #23463C; }
  </style>
</helmet>

<div style="width: 1280px; height: 880px; box-sizing: border-box; background: #FBFAF8; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #1A1815; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; padding: 0 56px; height: 72px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.5" stroke-linecap="round">
        <path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"></path>
      </svg>
      <span style="font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #57544E;">Resumi</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 56px;">
    <div style="width: 100%; max-width: 380px; display: flex; flex-direction: column;">

      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.12;">
        Create your account
      </h1>
      <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #57544E;">
        So your profile and every resume you make are here when you come back.
      </p>

      <button style="display: flex; align-items: center; justify-content: center; gap: 11px; width: 100%; margin-top: 34px; padding: 14px; border: 1px solid #DDD8D0; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1A1815; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z" fill="#4285F4"></path>
          <path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"></path>
          <path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z" fill="#FBBC05"></path>
          <path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" fill="#EA4335"></path>
        </svg>
        Continue with Google
      </button>

      <div style="display: flex; align-items: center; gap: 14px; margin: 24px 0;">
        <div style="flex-grow: 1; height: 1px; background: #E5E1DA;"></div>
        <span style="font-size: 12.5px; color: #A8A39B;">or</span>
        <div style="flex-grow: 1; height: 1px; background: #E5E1DA;"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 13.5px; color: #57544E;">Email</label>
        <input type="email" placeholder="you@example.com" style="width: 100%; box-sizing: border-box; padding: 14px 15px; border: 1px solid #E0DCD4; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1A1815; outline: none;">
      </div>

      <button style="width: 100%; margin-top: 18px; padding: 15px; border: none; border-radius: 4px; background: #2F5D50; color: #FBFAF8; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">
        Continue with email
      </button>

      <p style="margin: 26px 0 0; font-size: 12.5px; line-height: 1.6; color: #9A9690;">
        By continuing you agree to the Terms and Privacy Policy. Your resume and answers are yours &mdash; you can delete them at any time.
      </p>

      <div style="display: flex; justify-content: center; margin-top: 30px; padding-top: 24px; border-top: 1px solid #EBE7E0;">
        <span style="font-size: 14px; color: #8A8680;">Already have an account? <span style="color: #2F5D50;">Sign in</span></span>
      </div>

    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
