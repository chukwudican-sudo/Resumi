<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2F5D50; } a:hover { color: #23463C; }
  </style>
</helmet>

<div style="width: 1280px; height: 880px; box-sizing: border-box; background: #FBFAF8; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; color: #1A1815; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 64px; border-bottom: 1px solid #E9E5DE; background: #FFFFFF;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#57544E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"></path>
      </svg>
      <span style="font-size: 14.5px; color: #57544E;">Applications</span>
    </div>
    <div style="width: 30px; height: 30px; border-radius: 50%; background: #E7EBE8; display: flex; align-items: center; justify-content: center; font-size: 12.5px; color: #2F5D50;">AN</div>
  </div>

  <div style="flex-grow: 1; display: flex; justify-content: center; padding: 52px 40px; overflow: hidden;">
    <div style="width: 100%; max-width: 620px; display: flex; flex-direction: column;">

      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 38px; line-height: 1.1;">
        What are you applying for?
      </h1>
      <p style="margin: 12px 0 0; font-size: 15px; color: #57544E;">
        Paste the posting, or drop in screenshots. We&rsquo;ll pull out the details.
      </p>

      <div style="margin-top: 32px; border: 1px solid #E0DCD4; border-radius: 6px; background: #FFFFFF; overflow: hidden;">
        <textarea placeholder="Paste the job posting here…" style="width: 100%; box-sizing: border-box; min-height: 190px; padding: 20px; border: none; resize: none; font-family: inherit; font-size: 14.5px; line-height: 1.6; color: #1A1815; outline: none;"></textarea>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid #F0EDE7; background: #FCFBF9;">
          <button style="display: flex; align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid #E0DCD4; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-size: 13.5px; color: #57544E; cursor: pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#57544E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <path d="M21 15l-5-5L5 21"></path>
            </svg>
            Add screenshots
          </button>
          <span style="font-size: 12.5px; color: #A8A39B;">or paste an image</span>
        </div>
      </div>

      <div style="display: flex; gap: 14px; margin-top: 20px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px;">
          <label style="font-size: 13px; color: #8A8680;">Company</label>
          <div style="display: flex; align-items: center; gap: 9px; padding: 12px 14px; border: 1px solid #E0DCD4; border-radius: 4px; background: #FFFFFF;">
            <span style="font-size: 14.5px; color: #1A1815;">Shopify</span>
            <span style="padding: 2px 8px; border-radius: 3px; background: #EDF2EF; font-size: 11px; color: #2F5D50;">detected</span>
          </div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px;">
          <label style="font-size: 13px; color: #8A8680;">Role</label>
          <div style="display: flex; align-items: center; gap: 9px; padding: 12px 14px; border: 1px solid #E0DCD4; border-radius: 4px; background: #FFFFFF;">
            <span style="font-size: 14.5px; color: #1A1815;">Backend Engineering Intern</span>
            <span style="padding: 2px 8px; border-radius: 3px; background: #EDF2EF; font-size: 11px; color: #2F5D50;">detected</span>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 36px; padding-top: 24px; border-top: 1px solid #EBE7E0;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8680" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path>
          </svg>
          <span style="font-size: 13.5px; color: #8A8680;">Tailoring from your profile &middot; 68 details</span>
        </div>
        <button style="padding: 14px 30px; border: none; border-radius: 4px; background: #2F5D50; color: #FBFAF8; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">
          Tailor my resume
        </button>
      </div>

    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
